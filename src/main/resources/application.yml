# 服务器配置
server:
  port: 8080 # 端口号

spring:
  profiles:
    active: local
  # Redis 配置（本地开发用默认 localhost:6379）
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
  # MySQL 数据源（知识库文件管理）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/java_knowledge?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}
  # 上传文件大小限制（pdf/word/excel 可能较大）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 通义千问配置
ai:
  qwen:
    api-key: ${AI_QWEN_API_KEY:sk-your-api-key-here}  # 从环境变量读取，本地可放 application-local.yml
    model: qwen3.8-27b           # 推荐：平衡性能与价格，适合开发测试
    temperature: 0.7             # 创意度：0最严谨，1最发散，聊天用0.7刚好
    max-tokens: 1024             # 单次回复最大长度，避免token刷太快
  # 文本嵌入模型（向量化用）：维度必须与下面 milvus.dimension 严格一致，否则建集合失败
  embedding:
    model: text-embedding-v3     # DashScope 通义 text-embedding 系列
    dimension: 1024              # text-embedding-v3 输出 1024 维，v2 是 1536 维

# 知识库配置
knowledge:
  upload-dir: ${user.dir}/uploadFiles   # 上传文件存储目录

# Milvus 向量数据库配置
milvus:
  host: localhost
  port: 19530
  collection-name: knowledge_vectors   # 集合名统一小写下划线
  dimension: 1024                      # 向量维度，必须与 ai.embedding.dimension 完全一致

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true   # 下划线自动转驼峰
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志级别（本地开发打印 SQL）
